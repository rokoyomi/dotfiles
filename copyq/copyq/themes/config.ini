[General]
; ============================================================
;  CopyQ theme matching a Waybar stylesheet using:
;    @surface   #010101   @surf_alt  #464564
;    @text      #dee1ff   @primary   #735cce
;    @secondary #434b8f   @tertiary  #edbb9b
;    @bg_def     = mix(@surface, @secondary, 0.2)  -> #0e101d
;    @border-def = mix(@tertiary, @surface, 0.5)   -> #775e4e
;  Window chrome (menu/tool/tab bars) is pinned to ${bg} so the
;  whole window reads as pure black, not just the item list.
; ============================================================

; ---- core colors ----
fg=#dee1ff
bg=#010101
alt_bg=#0b0b10

sel_bg=#735cce
sel_fg=#dee1ff

find_bg="rgba(237,187,155,90)"
find_fg=#edbb9b

num_fg=#edbb9b

edit_bg=#0e101d
edit_fg=#dee1ff

notes_bg=#464564
notes_fg=#edbb9b

notification_bg=#464564
notification_fg=#dee1ff

; custom helper (referenced via ${border} below)
border=#775e4e

; ---- fonts ----
; "font" is used by the chrome (menu bar / tool bar / tab bar), so it
; keeps Cinzel for the waybar-matching look. Cinzel has no true lowercase
; glyphs (lowercase renders as small caps), which flattens case in actual
; clipboard content - so item text, the edit/preview pane, and notes all
; get an explicit normal font below instead, to keep original case legible.
; font="Cinzel,10,-1,5,50,0,0,0,0,0,Regular"
edit_font="Sans Serif,10,-1,5,50,0,0,0,0,0,Regular"
notes_font="Sans Serif,10,-1,5,50,0,0,0,0,0,Regular"
num_font="Cinzel,7,-1,5,25,0,0,0,0,0,Regular"
find_font="Sans Serif,10,-1,5,63,0,0,0,0,0,Regular"
notification_font="Sans Serif,10,-1,5,50,0,0,0,0,0,Regular"
font_antialiasing=true

; ---- misc ----
show_number=true
show_scrollbars=true
use_system_icons=true
icon_size=20
style_main_window=true
css_template_items=items
css_template_main_window=main_window
css_template_notification=notification
css_template_tooltip=tooltip

; ---- item rows: bordered "pill" look like the waybar modules ----
; font-family explicitly overridden here too, since the item list
; otherwise inherits the top-level "font" (Cinzel), which would
; visually flatten lowercase letters in real clipboard content.
item_css="\n    ;font-family: 'Sans Serif'"
alt_item_css="\n    ;background: ${alt_bg}"
hover_item_css="\n    ;background: ${alt_bg}"
cur_item_css="\n    ;border: 0.1em solid ${sel_bg}\n    ;border-radius: 0.5em"
sel_item_css="\n    ;background: ${sel_bg}\n    ;color: ${sel_fg}\n    ;border-radius: 0.5em"
notes_css="\n    ;border: 1px solid ${border}\n    ;border-radius: 0.4em\n    ;padding: 4px"
item_spacing=

; ---- search bar ----
search_bar="\n    ;background: ${edit_bg}\n    ;color: ${edit_fg}\n    ;border: 1px solid ${alt_bg}\n    ;margin: 2px"
search_bar_focused="\n    ;border: 1px solid ${sel_bg}"

; ---- menu bar / menus: forced to pure black, not system palette ----
menu_bar_css="\n    ;background: ${bg}\n    ;color: ${fg}"
menu_bar_disabled_css="\n    ;color: ${bg + #444}"
menu_bar_selected_css="\n    ;background: ${sel_bg}\n    ;color: ${sel_fg}"
menu_css="\n    ;border: 1px solid ${border}\n    ;background: ${bg}\n    ;color: ${fg}"

; ---- tab bar: pinned to ${bg} (pure black), no darkening offset ----
tab_bar_css="\n    ;background: ${bg}"
tab_bar_item_counter="\n    ;color: ${fg - #044 + #400}\n    ;font-size: 6pt"
tab_bar_scroll_buttons_css="\n    ;background: red\n    ;color: ${fg}\n    ;border: 0"
tab_bar_sel_item_counter="\n    ;color: ${sel_bg - #044 + #400}"
tab_bar_tab_selected_css="\n    ;padding: 0.5em\n    ;background: ${bg}\n    ;border: 0.05em solid ${sel_bg}\n    ;border-radius: 0.4em\n    ;color: ${fg}"
tab_bar_tab_unselected_css="\n    ;border: 0.05em solid ${bg}\n    ;padding: 0.5em\n    ;background: ${bg}\n    ;color: ${fg - #333}"

; ---- tab tree (nested tabs view) ----
tab_tree_css="\n    ;color: ${fg}\n    ;background-color: ${bg}"
tab_tree_item_counter="\n    ;color: ${fg - #044 + #400}\n    ;font-size: 6pt"
tab_tree_sel_item_counter="\n    ;color: ${sel_fg - #044 + #400}"
tab_tree_sel_item_css="\n    ;color: ${sel_fg}\n    ;background-color: ${sel_bg}\n    ;border-radius: 0.4em"

; ---- tool bar / buttons: forced to pure black ----
tool_bar_css="\n    ;color: ${fg}\n    ;background-color: ${bg}\n    ;border: 0"
tool_button_css="\n    ;color: ${fg}\n    ;background: ${bg}\n    ;border: 0\n    ;border-radius: 0.4em"
tool_button_pressed_css="\n    ;background: ${sel_bg}"
tool_button_selected_css="\n    ;background: ${sel_bg}\n    ;color: ${sel_fg}\n    ;border: 1px solid ${sel_bg}"

; left empty on purpose: everything the app draws is already covered
; above (menu/tool/tab bar all pinned to ${bg}). Add extra overrides
; here only if some other widget still shows through.
css=

