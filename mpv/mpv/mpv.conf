# --- Decoding ---
hwdec=auto-safe

# --- Video output ---
vo=gpu
profile=gpu-hq

# --- Cache / network streaming ---
cache=yes
demuxer-max-bytes=150MiB
demuxer-max-back-bytes=75MiB

ytdl-raw-options=format-sort="proto:dash"
ytdl-format=bestvideo[height<=720]+bestaudio/best

# --- OSD / on-screen display ---
osd-bar=yes
osd-font-size=28

# --- Subtitles ---
sub-auto=fuzzy
sub-font-size=36

# --- Screenshots ---
screenshot-format=png
screenshot-directory=~/media/pictures/mpv-screenshots

# --- Playback behavior ---
save-position-on-quit
keep-open=yes

# --- Interface ---
osc=no
border=yes
